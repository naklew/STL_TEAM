name: validate-slt

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python tools
        run: python -m compileall -q scripts
      - name: Validate repository package
        run: python scripts/validate_repo.py
      - name: Run routing policy eval
        run: python scripts/run_policy_eval.py
      - name: Run contract and write-set guard eval
        run: python scripts/run_guard_eval.py
      - name: Run setup and linked-worktree eval
        run: python scripts/run_setup_eval.py
